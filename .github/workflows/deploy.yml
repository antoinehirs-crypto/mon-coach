name: Déployer Mon Coach

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

jobs:
  serveur:
    name: Base et fonctions Supabase
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Lier le projet
        run: supabase link --project-ref "$REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Appliquer le schéma de base
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Clés serveur (Strava, IA)
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          args="STRAVA_CLIENT_ID=$STRAVA_CLIENT_ID STRAVA_CLIENT_SECRET=$STRAVA_CLIENT_SECRET"
          if [ -n "$GEMINI_API_KEY" ]; then args="$args GEMINI_API_KEY=$GEMINI_API_KEY"; fi
          supabase secrets set --project-ref "$REF" $args
      - name: Déployer les fonctions
        run: supabase functions deploy --project-ref "$REF" --no-verify-jwt --use-api
      - name: Réglages des comptes (adresse du site, inscription sans e-mail de confirmation)
        run: |
          curl -sf -X PATCH "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"site_url\":\"$APP_URL\",\"uri_allow_list\":\"$APP_URL**\",\"mailer_autoconfirm\":true}" > /dev/null
          echo "Auth configurée pour $APP_URL"

  site:
    name: Site (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Construire
        env:
          VITE_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_APK_URL: https://github.com/${{ github.repository }}/releases/latest/download/mon-coach.apk
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
